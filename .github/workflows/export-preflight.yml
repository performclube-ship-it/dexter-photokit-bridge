name: DEXTER export inspector safety tests
on:
  push:
    paths:
      - '.github/workflows/export-preflight.yml'
      - 'scripts/inspect-floot-export.mjs'
      - 'test/export-inspector.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/export-preflight.yml'
      - 'scripts/inspect-floot-export.mjs'
      - 'test/export-inspector.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: export-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse script and run fail-closed regression tests
        run: |
          node --check scripts/inspect-floot-export.mjs
          node --test test/export-inspector.test.mjs
