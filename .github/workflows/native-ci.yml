name: Verify Swift PhotoKit bridge (Xcode)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and package tests
        run: |
          bash scripts/verify-plugin.sh
      - name: Verify toolchain
        run: |
          xcodebuild -version
          pod --version
      - name: Build iOS Simulator fixture with plugin + CocoaPods
        run: bash scripts/build-ios-ci.sh
      - name: Save the package that passed Xcode
        uses: actions/upload-artifact@v4
        with:
          name: dexter-photokit-bridge-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14
